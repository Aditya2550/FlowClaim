<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
  text { font-family: system-ui, sans-serif; fill: #3d3d3a; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
</defs>

<!-- Background -->
<rect width="680" height="520" fill="#ffffff"/>

<!-- Title row labels -->
<text class="ts" x="80" y="28" text-anchor="middle">Employee</text>
<text class="ts" x="260" y="28" text-anchor="middle">System</text>
<text class="ts" x="440" y="28" text-anchor="middle">Approver(s)</text>
<text class="ts" x="610" y="28" text-anchor="middle">Outcome</text>

<!-- Divider lines -->
<line x1="165" y1="18" x2="165" y2="500" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="345" y1="18" x2="345" y2="500" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="525" y1="18" x2="525" y2="500" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Step 1: Submit (teal) -->
<rect x="30" y="44" width="100" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="80" y="62" text-anchor="middle" dominant-baseline="central" fill="#085041">Submit</text>
<text class="ts" x="80" y="76" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">expense + receipt</text>

<!-- Arrow to system -->
<line x1="130" y1="66" x2="192" y2="66" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 2: Validate (purple) -->
<rect x="192" y="44" width="136" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="260" y="62" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Validate + convert</text>
<text class="ts" x="260" y="76" text-anchor="middle" dominant-baseline="central" fill="#534AB7">currency via API</text>

<!-- Arrow down -->
<line x1="260" y1="88" x2="260" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 3: Check manager first (gray) -->
<rect x="192" y="118" width="136" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="260" y="136" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Is manager first?</text>
<text class="ts" x="260" y="150" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Check policy flag</text>

<!-- Yes branch → Manager -->
<line x1="328" y1="140" x2="372" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="134" text-anchor="middle">Yes</text>

<!-- Manager reviews (amber) -->
<rect x="372" y="118" width="136" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="440" y="136" text-anchor="middle" dominant-baseline="central" fill="#633806">Manager reviews</text>
<text class="ts" x="440" y="150" text-anchor="middle" dominant-baseline="central" fill="#854F0B">+ Socket.io notif</text>

<!-- No branch → next approver -->
<line x1="260" y1="162" x2="260" y2="192" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="270" y="180" text-anchor="start">No</text>

<!-- Step 4: Rule engine (purple) -->
<rect x="192" y="192" width="136" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="260" y="210" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Rule engine</text>
<text class="ts" x="260" y="224" text-anchor="middle" dominant-baseline="central" fill="#534AB7">sequential / % / CFO</text>

<!-- Manager approve → rule engine -->
<path d="M440 162 L440 214 L328 214" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420" y="208" text-anchor="end" fill="#1D9E75" font-size="12">Approved</text>

<!-- Manager reject → outcome -->
<path d="M508 140 L580 140" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="540" y="134" text-anchor="middle" fill="#E24B4A" font-size="12">Rejected</text>

<!-- Reject outcome (red) -->
<rect x="554" y="118" width="96" height="44" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text class="th" x="602" y="136" text-anchor="middle" dominant-baseline="central" fill="#791F1F">Rejected</text>
<text class="ts" x="602" y="150" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">notify employee</text>

<!-- Rule engine → next approver -->
<line x1="328" y1="214" x2="372" y2="214" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Next approvers (amber) -->
<rect x="372" y="192" width="136" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="440" y="210" text-anchor="middle" dominant-baseline="central" fill="#633806">Next approver(s)</text>
<text class="ts" x="440" y="224" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Finance / Director</text>

<!-- Condition check -->
<line x1="440" y1="236" x2="440" y2="276" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Condition met? (gray) -->
<rect x="372" y="276" width="136" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="440" y="294" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Condition met?</text>
<text class="ts" x="440" y="308" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">% rule or CFO rule</text>

<!-- Yes → approved -->
<line x1="508" y1="298" x2="554" y2="298" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="292" text-anchor="middle" fill="#639922" font-size="12">Yes</text>

<!-- Approved outcome (green) -->
<rect x="554" y="276" width="96" height="44" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="602" y="294" text-anchor="middle" dominant-baseline="central" fill="#27500A">Approved</text>
<text class="ts" x="602" y="308" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">notify employee</text>

<!-- No → more approvals needed -->
<line x1="440" y1="320" x2="440" y2="358" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="452" y="342" text-anchor="start">No</text>

<!-- All steps done? (gray) -->
<rect x="372" y="358" width="136" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="440" y="376" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">All steps done?</text>
<text class="ts" x="440" y="390" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">check sequence</text>

<!-- No → loop back -->
<path d="M372 380 L300 380 L300 214" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="298" y="300" text-anchor="end">More steps</text>

<!-- Yes → failed -->
<line x1="508" y1="380" x2="554" y2="380" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="374" text-anchor="middle" fill="#E24B4A" font-size="12">Failed</text>

<!-- Rejected (threshold not met) -->
<rect x="554" y="358" width="96" height="44" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text class="th" x="602" y="376" text-anchor="middle" dominant-baseline="central" fill="#791F1F">Rejected</text>
<text class="ts" x="602" y="390" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">threshold not met</text>

<!-- Socket.io notification -->
<line x1="602" y1="162" x2="602" y2="276" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="602" y1="402" x2="602" y2="440" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="554" y1="298" x2="554" y2="440" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2 2"/>

<!-- Socket.io event (blue) -->
<rect x="476" y="440" width="164" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="558" y="458" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Socket.io event</text>
<text class="ts" x="558" y="472" text-anchor="middle" dominant-baseline="central" fill="#185FA5">employee notified live</text>

<!-- Arrow back to employee -->
<path d="M476 462 L80 462 L80 88" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Legend -->
<rect x="40" y="490" width="10" height="10" rx="2" fill="#1D9E75"/>
<text class="ts" x="55" y="499">Approval path</text>
<rect x="140" y="490" width="10" height="10" rx="2" fill="#E24B4A"/>
<text class="ts" x="155" y="499">Rejection path</text>
<rect x="250" y="490" width="10" height="10" rx="2" fill="#378ADD"/>
<text class="ts" x="265" y="499">Notification</text>
<line x1="340" y1="495" x2="360" y2="495" stroke="#B4B2A9" stroke-dasharray="3 2" stroke-width="1"/>
<text class="ts" x="365" y="499">Loop back</text>
</svg>
